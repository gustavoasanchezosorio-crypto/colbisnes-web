<!-- Firma de Gustavo en dorado metálico, para fondos oscuros / azul corporativo.
     Trazada a partir de la firma original (azul sobre blanco). El viewBox está
     recortado a la tinta, sin margen sobrante, para que al escalarla no deje
     huecos verticales en la pantalla de lanzamiento. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 237 1720 415" fill="none">
  <defs>
    <linearGradient id="oroFirma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9971F"/>
      <stop offset="18%" stop-color="#F7E08A"/>
      <stop offset="42%" stop-color="#D4AF37"/>
      <stop offset="66%" stop-color="#F9E9A6"/>
      <stop offset="88%" stop-color="#D9B441"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <g stroke="url(#oroFirma)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trazo largo ascendente -->
    <path d="M 62 556 C 330 522 800 462 1146 427"/>
    <!-- Cruce tipo t -->
    <path d="M 570 410 C 552 472 520 562 497 630"/>
    <!-- Segundo trazo con las ondas -->
    <path d="M 628 523 C 762 509 866 495 934 484 C 950 481 958 469 969 467 C 981 465 985 486 997 487 C 1011 488 1017 473 1031 471 C 1081 467 1121 464 1151 461 C 1161 460 1167 476 1179 477 C 1216 474 1253 471 1289 468"/>
    <!-- Lazo grande -->
    <path d="M 1294 486 C 1298 356 1408 262 1528 259 C 1626 257 1662 334 1651 418 C 1640 514 1556 588 1438 597 C 1348 604 1300 562 1298 502"/>
    <!-- Gancho interior tipo n -->
    <path d="M 1352 534 C 1358 470 1362 408 1379 394 C 1409 372 1437 392 1441 430 C 1444 470 1446 500 1448 522"/>
    <!-- Rúbrica final -->
    <path d="M 1332 604 C 1442 661 1602 640 1738 548"/>
    <!-- Punto -->
    <circle cx="1668" cy="492" r="22" fill="url(#oroFirma)" stroke="none"/>
  </g>
</svg>
