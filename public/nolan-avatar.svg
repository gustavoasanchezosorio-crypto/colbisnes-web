<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nolan, asistente de Colbisnes">
  <defs>
    <radialGradient id="nolanFondo" cx="50%" cy="50%" r="75%">
      <stop offset="0%"  stop-color="#0c1a33"/>
      <stop offset="60%" stop-color="#070f22"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="nolanNubePurpura" cx="30%" cy="35%" r="55%">
      <stop offset="0%"  stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nolanNubeAzul" cx="68%" cy="38%" r="50%">
      <stop offset="0%"  stop-color="#1F6BFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#1455cc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1455cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nolanNubeMagenta" cx="55%" cy="72%" r="50%">
      <stop offset="0%"  stop-color="#ec4899" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#be185d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nolanNubeCian" cx="22%" cy="70%" r="42%">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nolanNucleo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e9d5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nolanBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Fondo: cielo profundo -->
  <rect x="0" y="0" width="200" height="200" fill="url(#nolanFondo)"/>

  <!-- Nubes de gas de la nebulosa, difuminadas y superpuestas -->
  <g filter="url(#nolanBlur)">
    <circle cx="60" cy="70" r="70" fill="url(#nolanNubePurpura)"/>
    <circle cx="136" cy="76" r="62" fill="url(#nolanNubeAzul)"/>
    <circle cx="110" cy="144" r="64" fill="url(#nolanNubeMagenta)"/>
    <circle cx="44" cy="140" r="48" fill="url(#nolanNubeCian)"/>
  </g>

  <!-- Nucleo brillante, como el corazon de la nebulosa -->
  <circle cx="98" cy="96" r="26" fill="url(#nolanNucleo)"/>

  <!-- Estrellas -->
  <circle cx="174.1" cy="161.0" r="1.60" fill="#ffffff" opacity="0.81"/>
